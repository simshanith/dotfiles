# chezmoi externals — pulled into $HOME at `chezmoi apply`. This whole file is a
# template, so entries can gate on init data. See:
#   https://www.chezmoi.io/reference/special-files/chezmoiexternal-format/
#
# Work-machine private dotfiles: on machines that answered work=true at
# `chezmoi init`, clone the private OneAdobe repo to ~/.dotfiles-work. It holds
# work-only, non-public bits (Brewfile.work, work aliases, ...) kept out of this
# public repo. Personal machines render this file empty -> no external.
#
# It's a real working clone (type=git-repo), so you can `cd ~/.dotfiles-work`,
# commit, and push. Refreshed (git pull --ff-only) at most weekly on apply.
{{- if .work }}
[".dotfiles-work"]
    type = "git-repo"
    url = "git@github.com:OneAdobe/shdaniel-work-dotfiles.git"
    refreshPeriod = "168h"
    [".dotfiles-work".pull]
        args = ["--ff-only"]
{{- end }}
