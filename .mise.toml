# Repo-only tools (dot-prefixed, so chezmoi ignores it). Fleet baseline: dot_config/mise/conf.d/fresh.toml.
[tools]
oxfmt = "latest" # Markdown formatter for this repo's docs (see 2026_REFRESH.md)
ruff = "latest"  # Python lint + format (config: .ruff.toml)

# Python checks for the skill scripts (PEP 723, run via `uv run --script`). `mise run py` runs all.
# mypy and pytest run through uvx with the scripts' dependencies, so nothing is installed globally.
[vars]
py_src = "dot_agents/skills claude private_bin/executable_rtk-allowlist-hook"

[tasks."py:fmt"]
description = "Format Python"
run = "ruff format {{vars.py_src}} && ruff check --fix {{vars.py_src}}"

[tasks."py:lint"]
description = "Lint Python (ruff, complexity limits in .ruff.toml)"
run = ["ruff format --check {{vars.py_src}}", "ruff check {{vars.py_src}}"]

[tasks."py:types"]
description = "Type-check Python (mypy --strict, 3.9 target)"
run = "uvx --python 3.14 --with pytest --with msgspec mypy@2.4 --config-file .mypy.ini {{vars.py_src}}"

[tasks."py:test"]
description = "Offline tests: everything on 3.14, the claude/ helpers also on 3.9 (system python3)"
run = [
  "uvx --python 3.14 --with msgspec pytest -q -p no:cacheprovider dot_agents/skills claude",
  "uvx --python 3.9 pytest -q -p no:cacheprovider claude",
]

[tasks.py]
description = "All Python checks"
depends = ["py:lint", "py:types", "py:test"]
