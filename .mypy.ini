# Repo-only (dot-prefixed, so chezmoi ignores it). Run: mise run py
[mypy]
# 3.10 is the oldest target mypy 2.x accepts. 3.9 compatibility (macOS system python3)
# is held by ruff's target-version and by running the tests on 3.9.
python_version = 3.10
strict = true
warn_unreachable = true
enable_error_code = ignore-without-code, redundant-expr, truthy-bool, possibly-undefined
